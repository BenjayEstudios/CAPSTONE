# QA en Oracle Cloud Always Free (VM ARM). Flujo y configuración:
# Proyecto/infra/oracle/README.md.
#
# Independiente de deploy-dev.yml (Digital Ocean): no lo toca ni depende de
# él. Mismo esquema, pero con imágenes ARM:
# 1. build: construye backend y nginx en un runner ARM nativo y las publica
#    en GHCR con tag "<sha>-arm64" y "dev-arm64" (las x86 de deploy-dev.yml
#    quedan intactas con "<sha>" y "dev").
# 2. deploy: SSH a la VM y infra/deploy/desplegar.sh con IMAGE_TAG=<sha>-arm64.
#
# TODO APAGADO hasta crear la variable de repositorio ORACLE_ENABLED=true.
# Rollback: Run workflow con "tag" = SHA de un deploy anterior (sin build ni
# migraciones).
name: Deploy QA Oracle

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rollback: SHA completo (40 caracteres) de un deploy anterior. Vacío = construir y desplegar el commit actual."
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Imagen ${{ matrix.imagen }} (arm64)
    if: >-
      vars.ORACLE_ENABLED == 'true' && github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || inputs.tag == '')
    # Runner ARM nativo (gratis en repos públicos): sin emulación QEMU, el
    # build de Angular tarda lo mismo que en x86.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - imagen: cotizapp-backend
            dockerfile: apps/backend/Dockerfile
          - imagen: cotizapp-nginx
            dockerfile: infra/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.imagen }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: Proyecto
          file: Proyecto/${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}-arm64
            ${{ env.IMAGEN }}:dev-arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.imagen }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}-arm64

  deploy:
    name: Deploy a la VM de Oracle
    needs: build
    if: >-
      !cancelled() && vars.ORACLE_ENABLED == 'true' && github.ref == 'refs/heads/dev' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment: qa-oracle
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Elegir versión
        env:
          TAG_ROLLBACK: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_ROLLBACK" ]; then
            if ! [[ "$TAG_ROLLBACK" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::tag debe ser un SHA completo de 40 caracteres en minúsculas"
              exit 1
            fi
            { echo "SHA=$TAG_ROLLBACK"; echo "OPCIONES=--sin-migraciones"; } >> "$GITHUB_ENV"
          else
            { echo "SHA=$GITHUB_SHA"; echo "OPCIONES="; } >> "$GITHUB_ENV"
          fi

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Igual que deploy-dev.yml: el clon queda en el commit del SHA y el token
      # de GHCR viaja por stdin. La única diferencia es IMAGE_TAG=<sha>-arm64.
      - name: Desplegar
        env:
          DEPLOY_HOST: ${{ secrets.ORACLE_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_PATH: ${{ vars.ORACLE_DEPLOY_PATH || '/opt/cotizapp' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'IFS= read -r GHCR_TOKEN'
            printf '%s\n' "$GHCR_TOKEN"
            cat <<'EOF'
          set -euo pipefail
          export GHCR_TOKEN GHCR_USER="$3"
          cd "$1"
          git fetch --prune origin dev
          git checkout --force --detach "$2"
          IMAGE_TAG="$2-arm64" bash Proyecto/infra/deploy/desplegar.sh ${4:+"$4"}
          EOF
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                bash -s -- "$DEPLOY_PATH" "$SHA" "$GITHUB_ACTOR" "$OPCIONES"
