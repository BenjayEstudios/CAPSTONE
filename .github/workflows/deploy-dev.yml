# Deploy al droplet (KAN-161). Flujo y configuración: Proyecto/infra/README.md
# (sección CI/CD).
#
# 1. build: construye las imágenes de backend y nginx y las publica en GHCR
#    con tag = SHA del commit y tag "dev". Corre siempre en push a dev.
# 2. deploy: entra por SSH al droplet y corre infra/deploy/desplegar.sh
#    (pull, migraciones, up sin build, health-check). APAGADO hasta crear la
#    variable de repositorio DEPLOY_ENABLED=true.
#
# Rollback: Run workflow con "tag" = SHA de un deploy anterior. No construye
# nada y no corre migraciones (son solo hacia adelante).
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rollback: SHA completo (40 caracteres) de un deploy anterior. Vacío = construir y desplegar el commit actual."
        required: false
        default: ""
        type: string

# Nunca se cancela un deploy a medias; el siguiente espera su turno.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# Cada job pide solo lo que necesita.
permissions: {}

jobs:
  build:
    name: Imagen ${{ matrix.imagen }}
    # Solo desde dev (un Run workflow desde otra rama no publica "dev"), y no
    # en un rollback.
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - imagen: cotizapp-backend
            dockerfile: apps/backend/Dockerfile
          - imagen: cotizapp-nginx
            dockerfile: infra/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # GHCR exige el nombre del dueño en minúsculas (BenjayEstudios → benjayestudios).
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.imagen }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El contexto es Proyecto/ (igual que en el compose). La label source
      # enlaza el paquete con este repo, así hereda sus permisos.
      - uses: docker/build-push-action@v7
        with:
          context: Proyecto
          file: Proyecto/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  deploy:
    name: Deploy al droplet
    needs: build
    # Sin build (rollback) el job igual corre si viene un tag.
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/dev' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Elegir versión
        env:
          TAG_ROLLBACK: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_ROLLBACK" ]; then
            if ! [[ "$TAG_ROLLBACK" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::tag debe ser un SHA completo de 40 caracteres en minúsculas"
              exit 1
            fi
            { echo "IMAGE_TAG=$TAG_ROLLBACK"; echo "OPCIONES=--sin-migraciones"; } >> "$GITHUB_ENV"
          else
            { echo "IMAGE_TAG=$GITHUB_SHA"; echo "OPCIONES="; } >> "$GITHUB_ENV"
          fi

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Deja el clon del droplet en el commit de IMAGE_TAG (así el compose y
      # desplegar.sh coinciden con las imágenes) y corre desplegar.sh.
      # El token de GHCR viaja por stdin: el script remoto lo lee con `read`
      # en su primera línea; nunca va en la línea de comandos.
      # TODO(KAN-159): con HTTPS, revisar el health-check de desplegar.sh.
      - name: Desplegar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/cotizapp' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'IFS= read -r GHCR_TOKEN'
            printf '%s\n' "$GHCR_TOKEN"
            cat <<'EOF'
          set -euo pipefail
          export GHCR_TOKEN GHCR_USER="$3"
          cd "$1"
          git fetch --prune origin dev
          git checkout --force --detach "$2"
          IMAGE_TAG="$2" bash Proyecto/infra/deploy/desplegar.sh ${4:+"$4"}
          EOF
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                bash -s -- "$DEPLOY_PATH" "$IMAGE_TAG" "$GITHUB_ACTOR" "$OPCIONES"
