document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c8f6c6df-0e9d-4b14-abd5-4130206aa934\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e4ce33d4-ecdf-41ba-838c-71a374832e87\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e56791d6-ad3c-42e9-bff7-4fcde754b938\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1805b8d4-3de7-4d39-85af-65b27271a614\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"62ba6420-d2ac-41fb-bd05-a947ced3af81\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a5df6332-9db0-42b3-856f-a578b78d0a63\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"12f92577-59c6-4a4d-ab5c-e22e5c3250b1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"6b2cd624-c212-417c-aa54-400a6a20e88d\"><\u002Fscript>\n<script src=\"e845579b-7352-4784-96d1-fcb02a17d9d3\"><\u002Fscript>\n<style>body{margin:0;background:var(--color-bg)}a{color:var(--color-accent)}a:hover{color:var(--color-accent-600)}<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text)\">\n\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 24px;background:var(--color-neutral-900);color:var(--color-neutral-100);font-size:11px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:40\">\n    <span style=\"opacity:.55;margin-right:8px\">Mockup · vista cliente<\u002Fspan>\n    <sc-for list=\"{{ navBtns }}\" as=\"b\" hint-placeholder-count=\"6\">\n      <button type=\"button\" sc-camel-on-click=\"{{ b.onClick }}\" style=\"font:inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid rgba(255,255,255,.18);border-radius:2px;padding:4px 9px;background:{{ b.bg }};color:{{ b.fg }}\">{{ b.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ variantBtns }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"opacity:.45;margin-left:12px\">variante<\u002Fspan>\n      <sc-for list=\"{{ variantBtns }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <button type=\"button\" sc-camel-on-click=\"{{ v.onClick }}\" style=\"font:inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid rgba(255,255,255,.18);border-radius:2px;padding:4px 9px;background:{{ v.bg }};color:{{ v.fg }}\">{{ v.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1340px;margin:0 auto;padding:0 40px\">\n\n    <div style=\"height:4px;background:var(--color-text);margin-top:22px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:18px;padding:7px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">\n      <span>Viernes 11 de septiembre de 2026<\u002Fspan>\n      <span>·<\u002Fspan>\n      <span>1.248 proveedores activos<\u002Fspan>\n      <span>·<\u002Fspan>\n      <span>Precios con IVA incluido<\u002Fspan>\n      <span style=\"margin-left:auto\">Envíos a todo Chile<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:var(--color-text)\"><\u002Fdiv>\n\n    <div style=\"display:flex;align-items:flex-end;gap:32px;padding:20px 0 18px\">\n      <div>\n        <div style=\"font-family:var(--font-heading);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.02em;cursor:pointer\" sc-camel-on-click=\"{{ goHome }}\">CompraMejor<\u002Fdiv>\n        <div style=\"font-size:12px;margin-top:6px;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Un producto. Todos los proveedores. Un solo carro.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:0;display:flex;gap:8px;align-items:center;max-width:520px\">\n        <input class=\"input\" type=\"search\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Buscar arroz, cloro, olla…\" style=\"min-height:42px;font-size:15px\">\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goSearch }}\" style=\"min-height:42px\">Buscar<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-left:auto;text-align:right\">\n        <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goCart }}\" style=\"min-height:42px\">Ver carro · {{ cartCount }} · {{ cartTotal }}<\u002Fbutton>\n        <div style=\"font-size:11px;margin-top:6px;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">{{ cartProvLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px 26px;padding-bottom:16px;font-size:13px\">\n      <sc-for list=\"{{ catLinks }}\" as=\"c\" hint-placeholder-count=\"10\">\n        <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"font:inherit;font-family:var(--font-body);cursor:pointer;background:none;border:0;padding:0;color:{{ c.fg }};font-weight:{{ c.fw }};border-bottom:2px solid {{ c.ul }}\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:var(--color-divider);margin-bottom:34px\"><\u002Fdiv>\n\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:56px;align-items:start;padding-bottom:20px\">\n        <div>\n          <h1 style=\"font-size:62px;line-height:1.02;margin:0 0 20px;max-width:15em;text-wrap:pretty\">Compara el mismo producto en todos sus proveedores antes de comprarlo.<\u002Fh1>\n          <p style=\"font-size:17px;max-width:44ch;margin-bottom:24px\">Abarrotes, refrigerados, aseo y equipamiento de distribuidores mayoristas y locales. Elige el proveedor que te conviene en cada línea y paga todo en un solo carro.<\u002Fp>\n          <div style=\"display:flex;gap:10px\">\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goCatalog }}\">Ver catálogo completo<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ openFirst }}\">Ejemplo: arroz 1 kg<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:48px;margin-top:52px;align-items:flex-start\">\n            <div>\n              <div class=\"cmyk-num\" style=\"font-family:var(--font-heading);font-weight:600;font-size:66px\"><span class=\"paper\">1.248<\u002Fspan><span class=\"plate plate-c\" aria-hidden=\"true\">1.248<\u002Fspan><span class=\"plate plate-m\" aria-hidden=\"true\">1.248<\u002Fspan><span class=\"plate plate-y\" aria-hidden=\"true\">1.248<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12px;margin-top:12px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Proveedores<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div class=\"cmyk-num\" style=\"font-family:var(--font-heading);font-weight:600;font-size:66px\"><span class=\"paper\">34 mil<\u002Fspan><span class=\"plate plate-c\" aria-hidden=\"true\">34 mil<\u002Fspan><span class=\"plate plate-m\" aria-hidden=\"true\">34 mil<\u002Fspan><span class=\"plate plate-y\" aria-hidden=\"true\">34 mil<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12px;margin-top:12px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Productos comparados<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h6 style=\"margin-bottom:14px\">Categorías<\u002Fh6>\n          <sc-for list=\"{{ homeGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"margin-bottom:26px\">\n              <div style=\"font-family:var(--font-heading);font-weight:600;font-size:20px;margin-bottom:8px\">{{ g.g }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <sc-for list=\"{{ g.subs }}\" as=\"s\" hint-placeholder-count=\"5\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"font:inherit;font-size:14px;text-align:left;cursor:pointer;background:none;border:0;padding:2px 0;color:var(--color-accent-700);display:flex;gap:10px\"><span>{{ s.label }}<\u002Fspan><span style=\"color:color-mix(in srgb, var(--color-text) 45%, transparent)\">{{ s.count }}<\u002Fspan><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <h6 style=\"margin:34px 0 12px\">Mayor diferencia de precio hoy<\u002Fh6>\n          <sc-for list=\"{{ spreadList }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"font:inherit;display )<\u002Fspan><span>{{ cartTotal }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span style=\"flex:1\">Despachos ({{ cartProvCount }})<\u002Fspan><span>{{ shipping }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:1px;background:var(--color-divider);margin:18px 0\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline\"><span style=\"flex:1;font-family:var(--font-heading);font-weight:600;font-size:17px\">Total<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:600;font-size:27px\">{{ grandTotal }}<\u002Fspan><\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"min-height:46px;margin-top:20px\">Pagar {{ grandTotal }}<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ goCart }}\">Volver al carro<\u002Fbutton>\n            <p style=\"font-size:12px;margin:18px 0 0;color:color-mix(in srgb, var(--color-text) 60%, transparent)\">Al pagar aceptas las condiciones de cada proveedor. Si un producto no está disponible, se devuelve ese monto en 48 h.<\u002Fp>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"height:1px;background:var(--color-text);margin-top:20px\"><\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:26px;padding:16px 0 50px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">\n      <span>CompraMejor<\u002Fspan><span>Vender en CompraMejor<\u002Fspan><span>Ayuda<\u002Fspan><span>Condiciones<\u002Fspan><span style=\"margin-left:auto\">Maqueta de diseño · datos de ejemplo<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}\">\nclass Component extends DCLogic {\n  state = { screen: \"home\", catVar: \"a\", pdpVar: \"a\", cat: \"Todos\", pid: \"arroz\", q: \"arroz\", cart: {} };\n\n  groups = [\n    { g: \"Alimentos\", subs: [\"Secos\", \"Legumbres\", \"Refrigerados\", \"Congelados\", \"Bebidas\"] },\n    { g: \"Aseo y hogar\", subs: [\"Aseo\", \"Baño\", \"Cocina\", \"Muebles\"] }\n  ];\n\n  prods = [\n    { id: \"arroz\", n: \"Arroz grano largo\", fmt: \"Bolsa 1 kg\", sub: \"Secos\", size: 1, unit: \"kg\", sku: \"AL-10042\",\n      offers: [[\"Distribuidora Andes\", 1290, \"24 h\", \"6 un.\", \"Región Metropolitana\"], [\"Comercial Bío Bío\", 1180, \"48 h\", \"12 un.\", \"Biobío y Ñuble\"], [\"Mayorista Aconcagua\", 1350, \"24 h\", \"1 un.\", \"Valparaíso\"], [\"Abastos del Sur\", 1240, \"72 h\", \"24 un.\", \"Los Lagos\"], [\"Alimentos Pacífico\", 1420, \"24 h\", \"1 un.\", \"Nacional\"]] },\n    { id: \"lentejas\", n: \"Lentejas laird\", fmt: \"Bolsa 1 kg\", sub: \"Legumbres\", size: 1, unit: \"kg\", sku: \"AL-10110\",\n      offers: [[\"Grupo Maule\", 2390, \"48 h\", \"6 un.\", \"Maule\"], [\"Distribuidora Andes\", 2550, \"24 h\", \"1 un.\", \"Región Metropolitana\"], [\"Central Norte\", 2290, \"5 días\", \"20 un.\", \"Antofagasta\"]] },\n    { id: \"fideos\", n: \"Fideos spaghetti\", fmt: \"Paquete 400 g\", sub: \"Secos\", size: 0.4, unit: \"kg\", sku: \"AL-10233\",\n      offers: [[\"Comercial Bío Bío\", 690, \"48 h\", \"12 un.\", \"Biobío y Ñuble\"], [\"Distribuidora Andes\", 740, \"24 h\", \"6 un.\", \"Región Metropolitana\"], [\"Alimentos Pacífico\", 820, \"24 h\", \"1 un.\", \"Nacional\"]] },\n    { id: \"aceite\", n: \"Aceite de maravilla\", fmt: \"Botella 900 ml\", sub: \"Secos\", size: 0.9, unit: \"L\", sku: \"AL-10318\",\n      offers: [[\"Mayorista Aconcagua\", 2190, \"24 h\", \"6 un.\", \"Valparaíso\"], [\"Grupo Maule\", 2090, \"72 h\", \"12 un.\", \"Maule\"], [\"Distribuidora Andes\", 2340, \"24 h\", \"1 un.\", \"Región Metropolitana\"]] },\n    { id: \"leche\", n: \"Leche entera\", fmt: \"Caja 1 L\", sub: \"Refrigerados\", size: 1, unit: \"L\", sku: \"AL-20061\",\n      offers: [[\"Alimentos Pacífico\", 1090, \"24 h\", \"12 un.\", \"Nacional\"], [\"Distribuidora Andes\", 1150, \"24 h\", \"6 un.\", \"Región Metropolitana\"], [\"Comercial Bío Bío\", 1040, \"48 h\", \"24 un.\", \"Biobío y Ñuble\"]] },\n    { id: \"queso\", n: \"Queso gauda laminado\", fmt: \"Bandeja 500 g\", sub: \"Refrigerados\", size: 0.5, unit: \"kg\", sku: \"AL-20144\",\n      offers: [[\"Grupo Maule\", 4590, \"48 h\", \"4 un.\", \"Maule\"], [\"Alimentos Pacífico\", 4890, \"24 h\", \"2 un.\", \"Nacional\"]] },\n    { id: \"arvejas\", n: \"Arvejas congeladas\", fmt: \"Bolsa 1 kg\", sub: \"Congelados\", size: 1, unit: \"kg\", sku: \"AL-30027\",\n      offers: [[\"Alimentos Pacífico\", 1890, \"24 h\", \"6 un.\", \"Nacional\"], [\"Grupo Maule\", 1790, \"72 h\", \"12 un.\", \"Maule\"]] },\n    { id: \"agua\", n: \"Agua mineral sin gas\", fmt: \"Botella 1,6 L\", sub: \"Bebidas\", size: 1.6, unit: \"L\", sku: \"BE-40012\",\n      offers: [[\"Central Norte\", 690, \"48 h\", \"12 un.\", \"Antofagasta\"], [\"Distribuidora Andes\", 790, \"24 h\", \"6 un.\", \"Región Metropolitana\"]] },\n    { id: \"jugo\", n: \"Néctar de durazno\", fmt: \"Caja 1 L\", sub: \"Bebidas\", size: 1, unit: \"L\", sku: \"BE-40088\",\n      offers: [[\"Comercial Bío Bío\", 990, \"48 h\", \"12 un.\", \"Biobío y Ñuble\"], [\"Mayorista Aconcagua\", 1090, \"24 h\", \"6 un.\", \"Valparaíso\"]] },\n    { id: \"cloro\", n: \"Cloro gel\", fmt: \"Botella 900 ml\", sub: \"Aseo\", size: 0.9, unit: \"L\", sku: \"AS-50019\",\n      offers: [[\"Distribuidora Andes\", 1190, \"24 h\", \"6 un.\", \"Región Metropolitana\"], [\"Mayorista Aconcagua\", 1090, \"48 h\", \"12 un.\", \"Valparaíso\"]] },\n    { id: \"papel\", n: \"Papel higiénico doble hoja\", fmt: \"4 rollos de 30 m\", sub: \"Baño\", size: 0, unit: \"\", sku: \"AS-50203\",\n      offers: [[\"Comercial Bío Bío\", 2690, \"48 h\", \"8 un.\", \"Biobío y Ñuble\"], [\"Distribuidora Andes\", 2890, \"24 h\", \"4 un.\", \"Región Metropolitana\"]] },\n    { id: \"olla\", n: \"Olla de aluminio 24 cm\", fmt: \"Unidad con tapa\", sub: \"Cocina\", size: 0, unit: \"\", sku: \"HO-60041\",\n      offers: [[\"Mayorista Aconcagua\", 12990, \"72 h\", \"1 un.\", \"Valparaíso\"], [\"Grupo Maule\", 11900, \"5 días\", \"2 un.\", \"Maule\"]] },\n    { id: \"estante\", n: \"Estante metálico 5 bandejas\", fmt: \"180 × 90 × 40 cm\", sub: \"Muebles\", size: 0, unit: \"\", sku: \"HO-60118\",\n      offers: [[\"Central Norte\", 39900, \"5 días\", \"1 un.\", \"Antofagasta\"], [\"Abastos del Sur\", 42500, \"72 h\", \"1 un.\", \"Los Lagos\"]] }\n  ];\n\n  clp(n) { return \"$\" + Math.round(n).toLocaleString(\"es-CL\"); }\n  go(screen) { return () => this.setState({ screen }); }\n  sorted(p) { return p.offers.slice().sort((a, b) => a[1] - b[1]); }\n\n  view(p) {\n    const os = this.sorted(p);\n    const lo = os[0], hi = os[os.length - 1];\n    const perUnit = p.size ? this.clp(lo[1] / p.size) + \"/\" + p.unit : \"—\";\n    return {\n      id: p.id, n: p.n, fmt: p.fmt, sub: p.sub, sku: p.sku, unit: p.unit || \"unidad\",\n      unitLabel: p.size ? \"Precio por \" + p.unit : \"Por unidad\",\n      desde: this.clp(lo[1]), porKg: perUnit, plazo: lo[2], max: this.clp(hi[1]),\n      provMin: lo[0], nOfertas: os.length,\n      ofertas: os.length + \" proveedores\", spread: this.clp(hi[1] - lo[1]),\n      onClick: () => this.setState({ screen: \"pdp\", pid: p.id }),\n      onQuickAdd: () => this.add(p.id, lo[0])\n    };\n  }\n\n  add(pid, prov) {\n    const key = pid + \"|\" + prov;\n    this.setState(s => ({ cart: Object.assign({}, s.cart, { [key]: (s.cart[key] || 0) + 1 }), screen: \"cart\" }));\n  }\n  bump(key, d) {\n    this.setState(s => {\n      const c = Object.assign({}, s.cart);\n      c[key] = (c[key] || 0) + d;\n      if (c[key] < 1) delete c[key];\n      return { cart: c };\n    });\n  }\n  drop(key) { this.setState(s => { const c = Object.assign({}, s.cart); delete c[key]; return { cart: c }; }); }\n\n  chip(label, isActive, onClick) {\n    return { label, active: isActive, onClick, bg: isActive ? \"var(--color-accent)\" : \"transparent\", fg: isActive ? \"var(--color-bg)\" : \"var(--color-neutral-100)\" };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const screens = [[\"home\", \"Portada\"], [\"catalog\", \"Catálogo\"], [\"search\", \"Búsqueda\"], [\"pdp\", \"Producto\"], [\"cart\", \"Carro\"], [\"checkout\", \"Pago\"]];\n    const navBtns = screens.map(([k, label]) => {\n      const on = st.screen === k;\n      return { label, onClick: this.go(k), bg: on ? \"var(--color-accent)\" : \"transparent\", fg: on ? \"#fff\" : \"rgba(255,255,255,.78)\" };\n    });\n\n    let variantBtns = null;\n    if (st.screen === \"catalog\" || st.screen === \"search\") {\n      variantBtns = [[\"a\", \"Tarjetas\"], [\"b\", \"Lista densa\"], [\"c\", \"Índice editorial\"]].map(([k, label]) => {\n        const on = st.catVar === k;\n        return { label, onClick: () => this.setState({ catVar: k, screen: \"catalog\" }), bg: on ? \"var(--color-accent-2-600)\" : \"transparent\", fg: on ? \"#fff\" : \"rgba(255,255,255,.78)\" };\n      });\n    } else if (st.screen === \"pdp\") {\n      variantBtns = [[\"a\", \"Tabla de proveedores\"], [\"b\", \"Lado a lado\"]].map(([k, label]) => {\n        const on = st.pdpVar === k;\n        return { label, onClick: () => this.setState({ pdpVar: k }), bg: on ? \"var(--color-accent-2-600)\" : \"transparent\", fg: on ? \"#fff\" : \"rgba(255,255,255,.78)\" };\n      });\n    }\n\n    const setCat = c => () => this.setState({ cat: c, screen: \"catalog\" });\n    const catLinks = [this.chip(\"Todos\", st.cat === \"Todos\", setCat(\"Todos\"))];\n    this.groups.forEach(g => {\n      catLinks.push({ label: g.g, active: st.cat === g.g, onClick: setCat(g.g) });\n      g.subs.forEach(s => catLinks.push({ label: s, active: st.cat === s, onClick: setCat(s) }));\n    });\n    catLinks.forEach(c => {\n      const isGroup = this.groups.some(g => g.g === c.label);\n      c.fg = c.active ? \"var(--color-accent-700)\" : (isGroup ? \"var(--color-text)\" : \"color-mix(in srgb, var(--color-text) 72%, transparent)\");\n      c.fw = isGroup ? 600 : 400;\n      c.ul = c.active ? \"var(--color-accent)\" : \"transparent\";\n    });\n\n    const inCat = p => {\n      if (st.cat === \"Todos\") return true;\n      const g = this.groups.find(x => x.g === st.cat);\n      return g ? g.subs.indexOf(p.sub) > -1 : p.sub === st.cat;\n    };\n    const list = this.prods.filter(inCat).map(p => this.view(p)).sort((a, b) => a.n.localeCompare(b.n));\n\n    const subsPresent = [];\n    list.forEach(p => { if (subsPresent.indexOf(p.sub) < 0) subsPresent.push(p.sub); });\n    const listBySub = subsPresent.map(sub => {\n      const items = list.filter(p => p.sub === sub);\n      return { sub, items, count: items.length + (items.length === 1 ? \" producto\" : \" productos\") };\n    });\n\n    const qn = (st.q || \"\").toLowerCase().trim();\n    const searchHits = this.prods.filter(p => !qn || (p.n + \" \" + p.sub + \" \" + p.fmt).toLowerCase().indexOf(qn) > -1).map(p => this.view(p));\n\n    const p = this.prods.find(x => x.id === st.pid) || this.prods[0];\n    const os = this.sorted(p);\n    const prod = this.view(p);\n    const colTops = [\"var(--color-accent)\", \"var(--color-accent-2)\", \"var(--color-neutral-400)\"];\n    prod.offers = os.map((o, i) => ({\n      prov: o[0], precio: this.clp(o[1]), porKg: p.size ? this.clp(o[1] / p.size) + \"/\" + p.unit : \"—\",\n      plazo: o[2], min: o[3], zona: o[4], best: i === 0,\n      rowBg: i === 0 ? \"var(--color-accent-100)\" : \"transparent\",\n      onAdd: () => this.add(p.id, o[0])\n    }));\n    prod.top = os.slice(0, 3).map((o, i) => ({\n      prov: o[0], short: o[0].split(\" \").slice(-1)[0], zona: o[4], colTop: colTops[i],\n      btnClass: i === 0 ? \"btn-primary\" : \"btn-secondary\", onAdd: () => this.add(p.id, o[0])\n    }));\n    prod.topCount = prod.top.length;\n    const cell = (v, note, hi) => ({ v, note: note ? \" \" + note : \"\", size: hi ? \"26px\" : \"18px\", fg: hi ? \"var(--color-accent-700)\" : \"var(--color-text)\" });\n    prod.rows = [\n      { label: \"Precio unitario\", cells: os.slice(0, 3).map((o, i) => cell(this.clp(o[1]), i === 0 ? \"más bajo\" : \"+\" + this.clp(o[1] - os[0][1]), i === 0)) },\n      { label: prod.unitLabel, cells: os.slice(0, 3).map(o => cell(p.size ? this.clp(o[1] / p.size) + \"/\" + p.unit : \"—\", \"\")) },\n      { label: \"Plazo de entrega\", cells: os.slice(0, 3).map(o => cell(o[2], \"\")) },\n      { label: \"Mínimo de compra\", cells: os.slice(0, 3).map(o => cell(o[3], \"\")) }\n    ];\n\n    const keys = Object.keys(st.cart);\n    let count = 0, total = 0, worst = 0;\n    const byProv = {};\n    keys.forEach(k => {\n      const [pid, prov] = k.split(\"|\");\n      const pp = this.prods.find(x => x.id === pid);\n      if (!pp) return;\n      const o = pp.offers.find(x => x[0] === prov);\n      const qty = st.cart[k];\n      const sorted = this.sorted(pp);\n      count += qty; total += o[1] * qty; worst += sorted[sorted.length - 1][1] * qty;\n      byProv[prov] = byProv[prov] || { prov, lines: [], subtotal: 0, plazo: o[2] };\n      byProv[prov].lines.push({ n: pp.n, fmt: pp.fmt, min: o[3], precio: this.clp(o[1]), qty, sub: this.clp(o[1] * qty), onPlus: () => this.bump(k, 1), onMinus: () => this.bump(k, -1), onRemove: () => this.drop(k) });\n      byProv[prov].subtotal += o[1] * qty;\n    });\n    const cartGroups = Object.keys(byProv).map(k => {\n      const g = byProv[k];\n      const items = g.lines.length;\n      return Object.assign({}, g, {\n        subtotal: this.clp(g.subtotal),\n        plazoLabel: \"Entrega\\u00a0\" + g.plazo,\n        itemsLabel: items + (items === 1 ? \" producto\" : \" productos\"),\n        note: \"Despacho de \" + g.prov + \": \" + this.clp(g.subtotal >= 40000 ? 0 : 2990) + (g.subtotal >= 40000 ? \" (gratis sobre $40.000)\" : \" · gratis sobre $40.000\")\n      });\n    });\n    const shipCost = cartGroups.reduce((a, g) => a + (g.subtotal.length && 0), 0) || cartGroups.length * 2990;\n    const provCount = cartGroups.length;\n\n    return {\n      navBtns, variantBtns, catLinks, list, listBySub,\n      isHome: st.screen === \"home\", isList: st.screen === \"catalog\", isSearch: st.screen === \"search\",\n      isPdp: st.screen === \"pdp\", isCart: st.screen === \"cart\", isCheckout: st.screen === \"checkout\",\n      catA: st.catVar === \"a\", catB: st.catVar === \"b\", catC: st.catVar === \"c\",\n      pdpA: st.pdpVar === \"a\", pdpB: st.pdpVar === \"b\",\n      goHome: this.go(\"home\"), goCatalog: this.go(\"catalog\"), goCart: this.go(\"cart\"),\n      goCheckout: this.go(\"checkout\"), goSearch: this.go(\"search\"),\n      goPdpA: () => this.setState({ pdpVar: \"a\" }), goPdpB: () => this.setState({ pdpVar: \"b\" }),\n      openFirst: () => this.setState({ screen: \"pdp\", pid: \"arroz\" }),\n      q: st.q, onQuery: e => this.setState({ q: e.target.value, screen: \"search\" }),\n      searchList: searchHits, searchCount: searchHits.length + (searchHits.length === 1 ? \" producto\" : \" productos\"),\n      listTitle: st.cat === \"Todos\" ? \"Todo el catálogo\" : st.cat,\n      listCount: list.length + (list.length === 1 ? \" producto\" : \" productos\"),\n      homeGroups: this.groups.map(g => ({ g: g.g, subs: g.subs.map(s => ({ label: s, count: this.prods.filter(x => x.sub === s).length, onClick: setCat(s) })) })),\n      spreadList: this.prods.map(x => this.view(x)).sort((a, b) => parseInt(b.spread.replace(/\\D/g, \"\")) - parseInt(a.spread.replace(/\\D/g, \"\"))).slice(0, 4),\n      prod, cartGroups,\n      cartCount: count, cartCountLabel: count + (count === 1 ? \" producto\" : \" productos\"), cartTotal: this.clp(total), cartProvCount: provCount,\n      cartProvLabel: provCount === 0 ? \"Sin proveedores aún\" : provCount + (provCount === 1 ? \" proveedor\" : \" proveedores\"),\n      cartEmpty: keys.length === 0, cartHas: keys.length > 0,\n      shipping: provCount ? this.clp(shipCost) : this.clp(0),\n      grandTotal: this.clp(total + (provCount ? shipCost : 0)),\n      savings: this.clp(worst - total)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
