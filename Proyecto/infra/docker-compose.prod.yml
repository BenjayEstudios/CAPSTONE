# Stack de producción del droplet: nginx (frontends + reverse proxy) +
# backend (Fastify) + mysql. Se levanta desde Proyecto/infra/:
#   docker compose -f docker-compose.prod.yml up -d --build
# Variables: infra/.env (ver .env.example). Documentación: infra/README.md.
# El docker-compose.yml de Proyecto/ es solo para desarrollo.
name: cotizapp

services:
  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Falta APP_DOMAIN en infra/.env}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    # Solo las variables que lee apps/backend/src/config/env.ts (+ las que usa
    # el logger). No se usa apps/backend/.env: ese es el de desarrollo.
    environment:
      NODE_ENV: production
      ENVIRONMENT: prd
      APP_NAME: cotizapp-backend
      HOST: 0.0.0.0
      PORT: 8000
      # MYSQL_PASSWORD debe ser alfanumérico: va dentro de una URL.
      DATABASE_URL: mysql://cotizapp:${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en infra/.env}@mysql:3306/cotizapp
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en infra/.env}
      # Los frontends llaman a /api en su mismo origen, así que CORS no entra
      # en juego para ellos; se deja el dominio por si algo llama desde fuera.
      CORS_ORIGINS: http://${APP_DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  # Sin "ports": MySQL solo es accesible desde la red interna de Docker.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: cotizapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en infra/.env}
      MYSQL_DATABASE: cotizapp
    volumes:
      - cotizapp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  cotizapp-mysql-data:
    # Nombre fijo (sin prefijo de proyecto) para que los scripts de respaldo
    # y la documentación lo encuentren siempre igual.
    name: cotizapp-mysql-data
