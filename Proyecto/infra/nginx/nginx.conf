server {
    listen 80;
    server_name _;

    # apps/web (Angular) se sirve como estáticos, ya buildeados en el droplet
    # o vía un servicio aparte (ej. otro contenedor nginx / CDN). Este stub
    # solo resuelve el reverse proxy hacia la API.
    location /api/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
