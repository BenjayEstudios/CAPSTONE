# TLS de los server{} en 443 (KAN-159). Un solo certificado de Let's Encrypt
# (--cert-name cotizapp) cubre APP_DOMAIN y ADMIN_DOMAIN. Lo renueva el
# servicio certbot del compose y Nginx lo relee con un reload periódico
# (entrypoint/40-recargar-certificados.sh).
ssl_certificate     /etc/letsencrypt/live/cotizapp/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/cotizapp/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
