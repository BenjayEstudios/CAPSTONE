# Reglas comunes para servir un build de Angular (SPA). Se incluye dentro de
# un server{} que ya definió su root.
index index.html;

# Archivos con hash del build (main-XXXXXXXX.js, chunk-..., styles-...): el
# nombre cambia en cada build, así que se pueden cachear para siempre. Si no
# existe, 404 (no index.html) para no servir HTML como JS tras un deploy.
location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
    access_log off;
}

# Fallback de SPA: cualquier ruta que no sea un archivo la resuelve el router
# de Angular. index.html nunca se cachea para que un deploy se vea al tiro.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
