# /api/* -> apps/backend. La barra final de proxy_pass quita el prefijo:
# /api/health-check llega al backend como /health-check (las rutas de
# Fastify no llevan /api). Los frontends usan apiUrl "/api" en producción,
# así que todo va al mismo origen y no hace falta CORS.
location ^~ /api/ {
    proxy_pass http://backend_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Igual a FILE_UPLOAD_MAX_MB del backend (subida de imágenes/documentos).
    client_max_body_size 25m;
}
