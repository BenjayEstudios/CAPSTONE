# /api/* -> apps/backend. La barra final de proxy_pass quita el prefijo:
# /api/health-check llega al backend como /health-check (las rutas de
# Fastify no llevan /api). Los frontends usan apiUrl "/api" en producción,
# así que todo va al mismo origen y no hace falta CORS.
location ^~ /api/ {
    proxy_pass http://backend_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Body demasiado grande (client_max_body_size, ver la plantilla): mismo
    # formato de error que el backend, para que los frontends lo muestren igual.
    error_page 413 = @body_demasiado_grande;
}

# En producción los archivos los sirve Nginx en /uploads/ (uploads.conf). El
# static del backend no tiene auth, así que no se expone por /api.
location ^~ /api/uploads/ {
    return 404;
}

location @body_demasiado_grande {
    default_type application/json;
    return 413 '{"error":{"code":"FST_REQ_FILE_TOO_LARGE","message":"El archivo supera el tamaño máximo permitido"}}';
}
