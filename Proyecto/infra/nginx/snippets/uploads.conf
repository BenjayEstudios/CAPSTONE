# /uploads/* -> archivos subidos por el backend. Nginx los lee directo del
# volumen cotizapp-uploads (montado de solo lectura en /srv/uploads), sin
# pasar por Node. Las URL las arma el backend con PUBLIC_BASE_URL:
#   http://<dominio>/uploads/productos/<id>/<uuid>.jpg
location ^~ /uploads/ {
    # Solo las imágenes de producto son públicas, y solo .jpg/.png (el
    # backend valida el tipo real por firma binaria y genera el nombre con un
    # UUID). Cualquier otra ruta da 404: los documentos de proveedor (KAN-150)
    # NO deben quedar públicos y tendrán que servirse por un endpoint con auth.
    location ~ "^/uploads/productos/[^/]+/[^/]+\.(?:jpg|png)$" {
        root /srv;
        # El nombre es un UUID que nunca se reescribe: caché para siempre.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Contenido subido por usuarios: que el navegador no adivine el tipo
        # ni ejecute nada aunque alguien colara un archivo raro.
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'; sandbox";
        try_files $uri =404;
        access_log off;
    }
    return 404;
}
