# Desafío HTTP-01 de Let's Encrypt (KAN-159). certbot escribe el archivo en
# el volumen cotizapp-acme y Let's Encrypt lo pide por http://<dominio>/.well-known/...
# Va en el puerto 80 de las dos plantillas, así se puede emitir el primer
# certificado con el sitio todavía en HTTP.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
}
