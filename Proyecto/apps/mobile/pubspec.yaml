name: cotizapp_mobile
description: App móvil de Cotizapp para compradores (catálogo, comparador, carro multiproveedor, pedidos) y distribuidores (ventas, visitas, calificaciones, órdenes, alertas).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.2.0
  dio: ^5.6.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
